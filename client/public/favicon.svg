<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0E" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#3626CE" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Hexagon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Neon Hexagonal Frame -->
  <polygon points="256,42 430,142 430,342 256,442 82,342 82,142" 
           fill="none" 
           stroke="url(#cyberNeon)" 
           stroke-width="18" 
           stroke-linejoin="round" 
           filter="url(#neonGlow)" />

  <!-- Inner Tech Shield -->
  <polygon points="256,70 400,153 400,331 256,414 112,331 112,153" 
           fill="rgba(0, 194, 255, 0.06)" 
           stroke="rgba(0, 194, 255, 0.25)" 
           stroke-width="4" />

  <!-- Gaming Controller & Cyber Emblem -->
  <g transform="translate(0, 5)">
    <!-- Controller Body -->
    <path d="M160,200 C140,200 110,230 115,300 C118,340 145,360 170,350 C195,340 210,310 256,310 C302,310 317,340 342,350 C367,360 394,340 397,300 C402,230 372,200 352,200 Z" 
          fill="url(#cyberNeon)" 
          opacity="0.95" />

    <!-- D-Pad (Left) -->
    <rect x="175" y="245" width="34" height="12" rx="3" fill="#FFFFFF" />
    <rect x="186" y="234" width="12" height="34" rx="3" fill="#FFFFFF" />

    <!-- Action Buttons (Right) -->
    <circle cx="325" cy="242" r="8" fill="#FFFFFF" />
    <circle cx="345" cy="262" r="8" fill="#FFFFFF" />
    <circle cx="305" cy="262" r="8" fill="#FFFFFF" />
    <circle cx="325" cy="282" r="8" fill="#FFFFFF" />

    <!-- Center Power / Crown Glow -->
    <circle cx="256" cy="245" r="14" fill="#00C2FF" filter="url(#neonGlow)" />
    <circle cx="256" cy="245" r="7" fill="#FFFFFF" />
  </g>
</svg>
